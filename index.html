  .result-bar{background:var(--bg);border-bottom:1px solid var(--border);padding:.75rem 1.25rem;display:flex;align-items:center;gap:.5rem;}
  .result-label{font-size:12px;font-weight:600;color:var(--sub);margin-right:auto;}

  .result-body h3{font-size:14px;font-weight:700;color:var(--accent);margin:1rem 0 .5rem;}

  .result-body th{background:var(--bg);border:1px solid var(--border);padding:.45rem .7rem;font-weight:600;text-align:left;}
  .result-body td{border:1px solid var(--border);padding:.45rem .7rem;vertical-align:top;}
  .result-body tr:nth-child(even) td{background:#fafbfc;}
  .result-body hr{border:none;border-top:1px solid var(--border);margin:1rem 0;}
  .result-body blockquote{background:#f8f9ff;border-left:3px solid var(--accent);padding:.75rem 1rem;margin:.5rem 0;font-size:13px;color:var(--sub);}
  .kms-table{width:100%;border-collapse:collapse;margin:.5rem 0;font-size:13px;}

  .kms-table td{border:1px solid var(--border);padding:.45rem .7rem;vertical-align:top;}

  .kms-table td li{margin:.15rem 0;display:list-item;}

  .hist-list{display:flex;flex-direction:column;gap:.6rem;}
  .hist-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.2rem;display:flex;align-items:center;gap:1rem;cursor:pointer;transition:box-shadow .2s;}

</style>
</head>

  </div>
</div>
</div>

  </div>
</div>
</div>

<div class="toast" id="toast"></div>

// ── 마크다운 → HTML ──
function mdToHtml(md) {
  if (!md) return '';
  const lines = md.split('\n');
  let html = '', inTable = false, tableHtml = '', firstRow = true;
  for (const line of lines) {
    if (/^\|[-| :]+\|$/.test(line.trim())) { firstRow = false; continue; }
    if (line.trim().startsWith('|') && line.trim().endsWith('|')) {
      if (!inTable) { inTable = true; firstRow = true; tableHtml = '<table>'; }
      const cells = line.trim().slice(1,-1).split('|').map(c=>c.trim());
      if (firstRow) { tableHtml += '<tr>'+cells.map(c=>'<th>'+c+'</th>').join('')+'</tr>'; firstRow = false; }
      else tableHtml += '<tr>'+cells.map(c=>'<td>'+c+'</td>').join('')+'</tr>';
      continue;
    }
    if (inTable) { html += tableHtml+'</table>'; inTable=false; tableHtml=''; firstRow=true; }
    if (/^#### /.test(line)) html += '<h4>'+line.replace(/^#### /,'')+'</h4>';
    else if (/^### /.test(line)) html += '<h3>'+line.replace(/^### /,'')+'</h3>';
    else if (/^## /.test(line)) html += '<h2>'+line.replace(/^## /,'')+'</h2>';
    else if (/^---$/.test(line.trim())) html += '<hr>';
    else if (line.trim()==='') html += '<br>';
    else html += '<p style="margin:.15rem 0">'+line.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')+'</p>';
  }
  if (inTable) html += tableHtml+'</table>';
  return html;
}

const HIST_KEY = 'handover_demo_hist_v1';
function saveHist(item) {
  let list = [];
  try { list = JSON.parse(localStorage.getItem(HIST_KEY)||'[]'); } catch {}
  list.unshift({...item, id:Date.now(), at:new Date().toLocaleString('ko-KR')});
  localStorage.setItem(HIST_KEY, JSON.stringify(list.slice(0,20)));
  renderHist();
}
function renderHist() {
  let list = [];
  try { list = JSON.parse(localStorage.getItem(HIST_KEY)||'[]'); } catch {}
  const el = document.getElementById('hist-list');
  if (!list.length) { el.innerHTML='<div style="text-align:center;padding:2rem;color:var(--sub);font-size:14px;">아직 생성된 인수인계서가 없습니다.</div>'; return; }
  el.innerHTML = list.map(h => {
    const bc = h.typeLabel.includes('정보보호')&&h.typeLabel.includes('산업안전보건')?'b-both':h.typeLabel.includes('정보보호')?'b-sec':'b-safe';
    return '<div class="hist-item"><span class="badge '+bc+'" onclick="loadHist('+h.id+')">'+h.typeLabel+'</span>'
      +'<div class="hist-info" onclick="loadHist('+h.id+')"><div class="hist-name">'+h.fromName+' → '+h.toName+'</div>'
      +'<div class="hist-meta">인계 시작: '+h.dateStart+'</div></div>'
      +'<div class="hist-date">'+h.at+'</div>'
      +'<button onclick="deleteHist('+h.id+')" style="margin-left:.5rem;background:none;border:1px solid #FCA5A5;color:#DC2626;border-radius:6px;padding:.3rem .6rem;font-size:11px;cursor:pointer;flex-shrink:0">🗑</button>'
      +'</div>';
  }).join('');
}
function loadHist(id) {
  let list = [];
  try { list = JSON.parse(localStorage.getItem(HIST_KEY)||'[]'); } catch {}
  const item = list.find(h=>h.id===id);
  if (!item) return;
  docText = item.docText; kmsHtmlData = item.kmsHtmlData || '';
  let finalHtml = mdToHtml(item.docText);
  if (kmsHtmlData) {
    finalHtml = finalHtml.replace('<p style="margin:.15rem 0">__KMS_HTML__</p>', kmsHtmlData);
    finalHtml = finalHtml.replace('__KMS_HTML__', kmsHtmlData);
  }
  document.getElementById('result-body').innerHTML = finalHtml;
  document.getElementById('result').classList.add('on');
  switchTab('gen', document.querySelectorAll('.tab')[0]);
  toast(item.fromName+' → '+item.toName+' 불러오기 완료', 'ok');
}
function deleteHist(id) {
  if (!confirm('이 이력을 삭제할까요?')) return;
  let list = [];
  try { list = JSON.parse(localStorage.getItem(HIST_KEY)||'[]'); } catch {}
  localStorage.setItem(HIST_KEY, JSON.stringify(list.filter(h=>h.id!==id)));
  renderHist(); toast('삭제됐습니다', 'ok');
}
function clearAllHist() {
  if (!confirm('이력을 모두 삭제할까요?')) return;
  localStorage.removeItem(HIST_KEY); renderHist(); toast('전체 이력이 삭제됐습니다', 'ok');
